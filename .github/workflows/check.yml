name: iCourse Catalog Diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pycryptodome
      - name: Compare school catalog counts without writing data
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          UIS_TOTP_SECRET: ${{ secrets.UIS_TOTP_SECRET }}
        run: python -u -m scripts.probe_catalog_completeness
